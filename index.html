<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0C0F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Life Max</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Max">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: social-app shell. Feed (stories + alerts + proof posts), Today (lock-in), Post (+), Vision (Future You), Me (profile, history, vault). Dark-first; each trait owns a color. */
:root{
  --bg:#0B0C0F; --surface:#15171C; --surface2:#1E2128; --line:#2A2E37; --ink:#F3F2EE; --muted:#8E929C;
  --hot:#FF4F7B; --amber:#FFB14A; --mint:#6FD3A0; --sky:#7DB7FF; --gold:#E9D27A; --lilac:#B79CFF; --onhot:#0B0C0F;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FAFAF8; --surface:#FFFFFF; --surface2:#F1F1EE; --line:#E3E3DE; --ink:#121317; --muted:#6C707A;
  --hot:#E2365F; --amber:#D7820E; --mint:#2E9E68; --sky:#2F6FD6; --gold:#A88A12; --lilac:#7A5BD6; --onhot:#FFFFFF; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FAFAF8; --surface:#FFFFFF; --surface2:#F1F1EE; --line:#E3E3DE; --ink:#121317; --muted:#6C707A;
  --hot:#E2365F; --amber:#D7820E; --mint:#2E9E68; --sky:#2F6FD6; --gold:#A88A12; --lilac:#7A5BD6; --onhot:#FFFFFF; color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--hot);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.screen{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.screen[hidden]{display:none!important}
.enter{animation:rise .4s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:none}}
.muted{color:var(--muted)}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.03em}
.logo i{font-style:normal;background:linear-gradient(90deg,var(--hot),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:999px;background:var(--surface2)}
.pill svg{width:13px;height:13px}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px}
.story .rg{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.story .rg span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg);border:3px solid var(--bg);font-family:var(--display);font-weight:800;font-size:18px}
.story .rg b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--surface2);font-family:var(--mono);font-weight:500;font-size:13px}
.story small{font-size:11px;color:var(--muted)}
.story.slip small{color:var(--hot)}

/* cards */
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border-left:4px solid var(--hot)}
.alert.mid{border-left-color:var(--amber)}
.alert .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center}
.alert .ic svg{width:20px;height:20px}
.alert .tx{flex:1;min-width:0;font-size:14px;line-height:1.35}
.alert .tx b{display:block;font-weight:600}
.alert .tx span{color:var(--muted);font-size:13px}
.lockbtn{flex:none;padding:9px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{font-size:21px}

.post{background:var(--surface);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;text-align:left;width:100%}
.post .ph{display:flex;align-items:center;gap:10px;padding:14px 16px}
.post .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--onhot);flex:none}
.post .av svg{width:18px;height:18px;stroke:currentColor}
.post .who{flex:1;min-width:0;font-size:13px;line-height:1.3}
.post .who b{font-weight:600;font-size:14px}
.post .xp{font-family:var(--mono);font-size:12px;color:var(--c)}
.post .pb{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.post .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.post .big small{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.post .note{font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.post img{display:block;width:100%;max-height:420px;object-fit:cover;background:var(--surface2)}
.stars{color:var(--amber);font-size:18px;letter-spacing:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.empty{padding:28px 20px;border-radius:22px;border:1.5px dashed var(--line);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h3{font-size:20px}

/* today */
.pace{display:flex;align-items:center;gap:18px}
.pace .ring{position:relative;width:110px;height:110px;flex:none}
.pace svg{width:100%;height:100%;transform:rotate(-90deg)}
.pace .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pace .in b{font-family:var(--display);font-size:34px;line-height:1}
.pace .in span{font-size:10px;color:var(--muted);font-family:var(--mono)}
.pace p{margin:0;font-size:14px;color:var(--muted)}
.pace h2{font-size:24px;line-height:1.1;margin-bottom:6px}
.boss{position:relative;border-radius:22px;padding:20px;background:linear-gradient(135deg,var(--hot),var(--amber));color:var(--onhot);display:flex;flex-direction:column;gap:12px;overflow:hidden}
.boss .eyebrow{color:inherit;opacity:.8}
.boss h3{font-size:24px;line-height:1.1}
.boss p{margin:0;font-size:14px;opacity:.9}
.hpbar{height:10px;border-radius:5px;background:rgba(0,0,0,.18);overflow:hidden}
.hpbar i{display:block;height:100%;background:currentColor;transition:width .6s ease}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.hot{background:var(--hot);color:var(--onhot)}
.btn.line{border:1.5px solid currentColor}
.btn.soft{background:var(--surface2)}
.btn[disabled]{opacity:.5}
.boss.won{background:var(--surface);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;aspect-ratio:1;border-radius:20px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;padding:12px;text-align:left;transition:transform .2s cubic-bezier(.3,1.6,.5,1);overflow:hidden;min-width:0}
.tile:active{transform:scale(.94)}
.tile svg{width:24px;height:24px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .tn{font-size:13px;font-weight:600;line-height:1.2}
.tile .tx{font-family:var(--mono);font-size:10px;color:var(--muted)}
.tile.on{background:var(--c);color:var(--onhot)}
.tile.on svg{stroke:var(--onhot)}
.tile.on .tx{color:inherit;opacity:.75}
.tile .chk{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line)}
.tile .chk{display:grid;place-items:center;font-size:11px;font-weight:700}
.tile.on .chk{border:0;background:var(--onhot);color:var(--c)}
.mainq{border-radius:22px;padding:20px;background:var(--surface);display:flex;flex-direction:column;gap:8px;width:100%}
.mainq h3{font-size:20px;line-height:1.15}
.mainq .go{font-family:var(--mono);font-size:12px;color:var(--amber)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cd{padding:14px;border-radius:18px;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.cd b{font-family:var(--display);font-size:30px;line-height:1}
.cd span{font-size:11px;color:var(--muted);line-height:1.3}
.cd.hot b{color:var(--hot)}

/* vision */
.vhero{display:flex;flex-direction:column;gap:6px}
.vhero h1{font-size:36px;line-height:1}
.vmatch{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;background:linear-gradient(90deg,var(--hot),var(--amber),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.vstate{width:100%;min-height:84px;resize:none;border:0;border-radius:18px;background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:500;font-size:18px;line-height:1.35;padding:16px}
.radar{width:100%;max-width:340px;margin:0 auto;display:block}
.radar text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.traits{display:flex;flex-direction:column;gap:8px}
.trait{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:14px 16px;border-radius:18px;background:var(--surface);width:100%;align-items:center}
.trait b{font-family:var(--display);font-size:17px}
.trait .st{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface2)}
.trait .st.up{color:var(--mint)}.trait .st.dn{color:var(--hot)}
.trait .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.trait .bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.world{padding:16px;border-radius:20px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.world b{font-family:var(--display);font-size:17px;line-height:1.1}
.world span{font-size:12px;color:var(--muted)}
.world .bar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.world .bar i{display:block;height:100%;background:var(--c)}
.world.main{background:linear-gradient(135deg,var(--hot),var(--amber));color:var(--onhot)}
.world.main span{color:inherit;opacity:.8}.world.main .bar{background:rgba(0,0,0,.18)}.world.main .bar i{background:var(--onhot)}

/* me */
.prof{display:flex;align-items:center;gap:16px}
.prof .ava{flex:none;width:86px;height:86px;border-radius:50%;padding:3px;background:conic-gradient(var(--hot),var(--amber),var(--mint),var(--sky),var(--lilac),var(--hot))}
.prof .ava span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--surface);border:3px solid var(--bg);font-family:var(--display);font-weight:800;font-size:30px}
.prof h1{font-size:24px;line-height:1.1}
.prof p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.stats span{font-size:11px;color:var(--muted)}
.lvbar{display:flex;flex-direction:column;gap:6px}
.lvbar .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.lvbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--amber))}
.lvbar .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
.heat i{width:100%;aspect-ratio:1;min-width:14px;border-radius:3px;background:var(--surface2)}
.heatwrap{overflow-x:auto}
.weekcmp{display:flex;flex-direction:column;gap:8px}
.weekcmp div{display:grid;grid-template-columns:70px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.weekcmp .b{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.weekcmp .b i{display:block;height:100%;border-radius:5px}
.diary{display:flex;flex-direction:column}
.dline{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.dline .dt{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.3}
.dline .dt b{display:block;font-family:var(--display);font-size:22px;color:var(--ink)}
.dline .dx b{font-weight:600}.dline .dx p{margin:2px 0 0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.jar{display:flex;flex-direction:column;gap:6px;min-width:0;text-align:center}
.jar .gl{position:relative;height:110px;border-radius:16px 16px 20px 20px;background:var(--surface);overflow:hidden}
.jar .fl{position:absolute;inset:auto 0 0;background:var(--c);transition:height 1s cubic-bezier(.2,.8,.2,1)}
.jar .pc{position:absolute;inset:auto 0 8px;font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink)}
.jar small{font-size:11px;color:var(--muted);line-height:1.2}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-radius:18px;background:var(--surface);width:100%}
.total b{font-family:var(--display);font-size:24px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on svg{stroke-width:2.4}
.plus{justify-self:center;width:52px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--hot),var(--amber));color:var(--onhot)}
.plus svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sin{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.shh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.shh h2{font-size:28px;line-height:1.05}
.shh p{margin:6px 0 0;color:var(--muted);font-size:14px}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.x svg{width:15px;height:15px;stroke:var(--ink);stroke-width:2.2;fill:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea{font-family:var(--body);font-size:16px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field textarea.dump{min-height:200px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rate{display:flex;gap:6px}
.rate button{font-size:30px;color:var(--line)}
.rate button.on{color:var(--amber)}
.photo{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px dashed var(--line);cursor:pointer;font-size:14px;color:var(--muted)}
.photo img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.jout{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--surface)}
.jout h3{font-size:22px;line-height:1.15}
.jout ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.jout .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.jout .one{padding:12px;border-radius:12px;background:var(--surface2);font-weight:600}
.choose{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.now{border-radius:20px;padding:20px;background:var(--surface);display:flex;flex-direction:column;gap:16px}
.now .q{font-family:var(--display);font-size:22px;line-height:1.15;font-weight:800}
.skip{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.later{display:flex;flex-direction:column;gap:8px}
.later button{display:flex;justify-content:space-between;gap:12px;padding:13px 15px;border-radius:14px;background:var(--surface);width:100%;font-size:14px}
.later button span:last-child{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.trophies{display:flex;flex-wrap:wrap;gap:6px}
.trophy{padding:6px 12px;border-radius:999px;background:var(--surface2);font-size:12px}
.amt{font-family:var(--display);font-size:50px;font-weight:800;line-height:1}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{padding:11px 15px;border-radius:999px;background:var(--surface);font-family:var(--mono);font-size:14px}

/* fx */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:50;transform:translate(-50%,-30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-family:var(--mono);font-size:13px;transition:all .3s cubic-bezier(.2,.9,.2,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spark{position:fixed;z-index:45;width:8px;height:8px;border-radius:50%;pointer-events:none}
.float{position:fixed;z-index:46;font-family:var(--display);font-weight:800;font-size:22px;pointer-events:none;color:var(--amber)}

function daysTo(y,m,d){const n=new Date();return Math.max(0,Math.ceil((new Date(y,m,d)-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5))}
const hasProof=e=>!!(e&&(e.note||e.num||e.num2||e.rating||e.title||e.photo||e.dump));

/* ======== scoring ======== */
function lvl(xp,s=1){let lv=1,need=100*s,left=xp;while(left>=need){left-=need;lv++;need=Math.round((100+40*(lv-1))*s)}return{lv,into:left,need}}
function habitXP(k){return(S.log[k]||[]).reduce((a,id)=>{const h=H(id);if(!h)return a;const e=E[k+"_"+id];return a+h.xp+(hasProof(e)?Math.round(h.xp*.5):0)},0)}
function questXP(pid){let x=0;for(const[q,,v]of P(pid).quests)if(S.quests[pid+":"+q])x+=v;return x}
function txp(){let x=(S.bossRounds||0)*10+(S.bossXP||0)+todoXP();for(const k in S.log)x+=habitXP(k);for(const p of PILLARS)x+=questXP(p.id);const g=S.goals;
  return x+chalXP()+Math.floor((+g.debt.paid||0)/20)+Math.floor(((+g.cushion.saved||0)+(+g.cali.saved||0)+(+g.move.saved||0))/50)}
function streak(){let n=0;const d=new Date();if(!(S.log[dkey(d)]||[]).length)d.setDate(d.getDate()-1);while((S.log[dkey(d)]||[]).length){n++;d.setDate(d.getDate()-1)}return n}
// Momentum: recency-weighted reps over 14 days vs the pace Future You keeps. Today only counts once done.
function momentum(habitIds){let a=0,e=0;for(let i=0;i<14;i++){const w=Math.pow(.88,i),k=daysAgo(i);
  for(const id of habitIds){const h=H(id),d=done(id,k);if(d)a+=w;if(i>0||d)e+=w*h.freq/7}}return e?Math.min(100,Math.round(a/e*100)):0}
function trend(habitIds){let r=0,o=0;for(let i=0;i<7;i++)for(const id of habitIds){if(done(id,daysAgo(i)))r++;if(done(id,daysAgo(i+7)))o++}return r>o?"up":r<o?"dn":"flat"}
function questPct(worlds){let a=0,b=0;for(const w of worlds){const p=P(w);b+=p.quests.length;a+=p.quests.filter(([q])=>S.quests[w+":"+q]).length}return b?a/b*100:0}
function traitScore(t){let s=.6*momentum(TH(t))+.4*questPct(t.worlds);
  if(t.id==="wealthy"){const g=S.goals,f=GOALS.reduce((a,G)=>a+Math.min(1,(+g[G.k][G.f]||0)/(+g[G.k].target||1)),0)/GOALS.length*100;s=.4*momentum(TH(t))+.3*questPct(t.worlds)+.3*f}
  return Math.round(s)}
function visionMatch(){return Math.round(TRAITS.reduce((a,t)=>a+traitScore(t),0)/TRAITS.length)}
function lastDone(id){for(let i=0;i<120;i++)if(done(id,daysAgo(i)))return i;return null}
function behind(){const out=[];for(const h of HABITS){if(done(h.id,today()))continue;const ld=lastDone(h.id),lim=Math.ceil(7/h.freq);
  const gap=ld===null?null:ld;if(gap===null||gap>lim)out.push({h,gap,ratio:gap===null?2:gap/lim})}
  return out.sort((a,b)=>b.ratio-a.ratio||b.h.freq-a.h.freq)}
function paceToday(){const exp=HABITS.reduce((a,h)=>a+h.freq/7,0),d=(S.log[today()]||[]).length;return Math.min(100,Math.round(d/exp*100))}
function titleFor(lv){return["Rookie","Starter","Grinder","Contender","Operator","Main Character","Architect","Unicorn"][Math.min(7,Math.floor((lv-1)/2))]}

/* ======== fx ======== */
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1700)}
function burst(el,label){if(!el)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const f=document.createElement("div");f.className="float";f.textContent=label;f.style.left=(cx-24)+"px";f.style.top=(cy-30)+"px";document.body.appendChild(f);
  if(reduce){setTimeout(()=>f.remove(),700);return}
  f.animate([{transform:"translateY(0)",opacity:1},{transform:"translateY(-56px)",opacity:0}],{duration:950,easing:"ease-out"}).onfinish=()=>f.remove();
  const cols=["var(--hot)","var(--amber)","var(--mint)","var(--sky)"];
  for(let i=0;i<16;i++){const s=document.createElement("div");s.className="spark";s.style.background=cols[i%4];s.style.left=cx+"px";s.style.top=cy+"px";document.body.appendChild(s);
    const a=Math.PI*2*i/16+Math.random()*.4,d=40+Math.random()*50;
    s.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(.2)`,opacity:0}],{duration:700+Math.random()*250,easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish=()=>s.remove()}}
function levelCheck(before){const a=lvl(before).lv,b=lvl(txp()).lv;if(b>a){$("lvupN").textContent=b;$("lvupT").textContent=titleFor(b)+" · tap to keep going";$("lvup").classList.add("on");clearTimeout(window._lv);window._lv=setTimeout(()=>$("lvup").classList.remove("on"),2800)}}

/* ======== views ======== */
function header(){const L=lvl(txp()),st=streak();
  return `<div class="hdr"><div class="logo">life<i>max</i></div><div class="pills">
  <span class="pill num"><svg viewBox="0 0 24 24" fill="var(--amber)"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg>${st}</span>
  <span class="pill num">OVR ${Math.floor(ovrOn(today()))}</span></div></div>`}
function storyRow(){return `<div class="stories">${TRAITS.map(t=>{const m=momentum(TH(t)),tr=trend(TH(t));
  return `<button class="story ${m<40?"slip":""}" data-act="trait" data-id="${t.id}"><span class="rg" style="--c:${t.c};--p:${m}"><span style="color:${t.c}">${m}</span></span><small>${t.name}${m<40?" ↓":tr==="up"?" ↑":""}</small></button>`}).join("")}</div>`}
function postCard(e){const h=H(e.habit);if(!h)return"";const t=h.trait,c=t.c;let body="";
  if(h.kind==="run"&&(e.num||e.num2))body+=`<div class="big num">${e.num?esc(e.num)+" mi":""}${e.num2?`<small>${esc(e.num2)} min${e.num&&e.num2?" · "+(e.num2/e.num).toFixed(1)+" min/mi":""}</small>`:""}</div>`;
  if(h.kind==="mins"&&e.num)body+=`<div class="big num">${esc(e.num)}<small>minutes</small></div>`;
  if(h.kind==="read"&&(e.num||e.title))body+=`<div class="big num">${e.num?esc(e.num):"📖"}<small>${e.num?"pages":""}${e.title?(e.num?" · ":"")+esc(e.title):""}</small></div>`;
  if(h.kind==="film"){if(e.title)body+=`<div class="big" style="font-size:24px">${esc(e.title)}</div>`;if(e.rating)body+=`<div class="stars">${"★".repeat(e.rating)}<span style="color:var(--line)">${"★".repeat(5-e.rating)}</span></div>`}
  if(h.kind==="journal"&&e.journal){body+=`<div class="big" style="font-size:22px">${esc(e.journal.title)}</div><div class="note">${esc(e.journal.summary)}</div>`;
    if(e.journal.themes?.length)body+=`<div class="tags">${e.journal.themes.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}${e.journal.mood?`<span class="tag">mood: ${esc(e.journal.mood)}</span>`:""}</div>`}
  else if(h.kind==="journal"&&e.dump)body+=`<div class="note">${esc(e.dump.length>220?e.dump.slice(0,220)+"…":e.dump)}</div>`;
  if(e.note)body+=`<div class="note">${esc(e.note)}</div>`;
  const xp=h.xp+(hasProof(e)?Math.round(h.xp*.5):0);
  return `<button class="post" data-act="entry" data-id="${esc(e._id)}" style="--c:${c}">
   <div class="ph"><span class="av">${ico(h.id)}</span><span class="who"><b>You ${h.verb}</b><br><span class="muted">${ago(e.ts)} · ${t.name}</span></span><span class="xp">+${xp}</span></div>
   ${e.photo?`<img src="${photoSrc(e.photo)}" alt="" loading="lazy">`:""}
   ${body?`<div class="pb" ${e.photo?'style="padding-top:14px"':""}>${body}</div>`:""}</button>`}
function vFeed(){
  const list=Object.values(E).sort((a,b)=>b.ts-a.ts).slice(0,60),bh=behind().slice(0,3);
  return `${header()}${ovrCard()}${friendStrip()}${storyRow()}
  ${bh.length?`<div><div class="sec-h" style="margin-bottom:10px"><h2>Falling behind</h2><span class="eyebrow">vs Future You</span></div><div class="alerts">${bh.map(({h,gap})=>`
   <div class="alert ${gap!==null&&gap<5?"mid":""}"><span class="ic">${ico(h.id,h.trait.c)}</span><span class="tx"><b>${gap===null?h.name+": not started":h.name+": "+gap+" days"}</b><span>Future you does this ${h.freq}× a week</span></span><button class="lockbtn" data-act="proof" data-id="${h.id}">Lock in</button></div>`).join("")}</div></div>`
   :`<div class="card"><span class="eyebrow">On pace</span><h3>Nothing slipping. You're moving like Future You.</h3></div>`}
  <div style="display:flex;flex-direction:column;gap:14px"><div class="sec-h"><h2>Your feed</h2><span class="eyebrow">${Object.keys(E).length} proofs</span></div>
  ${list.length?list.map(postCard).join(""):`<div class="empty"><h3>Your feed starts with your first proof.</h3><p class="muted" style="margin:0">Tap + to post a workout, a journal entry, a film, anything you locked in.</p><button class="btn hot" data-act="post">Post your first proof</button></div>`}</div>`}

  const pc=paceToday(),C=2*Math.PI*48,r=S.bossRounds||0,won=!!S.quests["school:mid"],tl=S.log[today()]||[];
  const mq=(P("career")?P("career").quests.find(([q])=>!S.quests["career:"+q]):null),job=daysTo(2026,11,5);
  const d=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  return `${header()}
  <div class="pace"><div class="ring"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" fill="none" stroke="var(--surface2)" stroke-width="10"/>
   <circle cx="55" cy="55" r="48" fill="none" stroke="url(#pg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}" style="transition:stroke-dashoffset .8s ease"/>

   <div class="in"><b class="num" style="font-family:var(--display)">${pc}%</b><span>PACE</span></div></div>
   <div><span class="eyebrow">${esc(d)}</span><h2>${pc>=100?"Locked in. Future you is proud.":pc>=60?"Good pace. Keep stacking.":tl.length?"You started. Stack 2 more.":"Day's open. Lock in one thing."}</h2><p>${tl.length} done today · post proof for +50% XP</p></div></div>

  ${bossCard()}
  ${board()}<div style="display:flex;flex-direction:column;gap:12px"><div class="sec-h"><h2>Lock in</h2><span class="eyebrow">tap to post proof</span></div>
  <div class="grid">${HABITS.map(h=>{const on=tl.includes(h.id);return `<button class="tile ${on?"on":""}" style="--c:${h.trait.c}" data-act="${on?"entryToday":"proof"}" data-id="${h.id}">
   <span class="chk">${on?"✓":""}</span>
   <svg viewBox="0 0 24 24">${ICON[h.id]||ICON._custom}</svg><span><span class="tn">${h.name}</span><br><span class="tx">+${h.xp} · +${Math.round(h.xp*.5)} proof</span></span></button>`}).join("")}<button class="tile add" data-act="custom"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="tn">Your habits</span></button></div></div>
  ${checkCard()}
  <div style="display:flex;flex-direction:column;gap:10px"><div class="sec-h"><h2>Today so far</h2><span class="eyebrow">decided by what you log</span></div>${rateRow(today())}</div>
  ${mq?`<button class="mainq" data-act="world" data-id="career"><span class="eyebrow">Main quest</span><h3>${esc(mq[1])}</h3><span class="go">+${mq[2]} XP · open Career</span></button>`:""}
  ${countsRow()}`}
function radar(){const n=TRAITS.length,cx=170,cy=150,R=110,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
  const poly=vals=>vals.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(",")).join(" ");
  let g="";for(const ring of[25,50,75,100])g+=`<polygon points="${poly(TRAITS.map(()=>ring))}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  TRAITS.forEach((t,i)=>{const[x,y]=pt(i,100),[lx,ly]=pt(i,122);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly+3}" text-anchor="middle">${t.name.toUpperCase()}</text>`});
  const now=TRAITS.map(traitScore);
  return `<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="Your traits now versus your vision">${g}
   <polygon points="${poly(TRAITS.map(()=>100))}" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="4 4"/>
   <polygon points="${poly(now.map(v=>Math.max(4,v)))}" fill="var(--hot)" fill-opacity=".28" stroke="var(--hot)" stroke-width="2"/>
   ${now.map((v,i)=>{const[x,y]=pt(i,Math.max(4,v));return`<circle cx="${x}" cy="${y}" r="4" fill="${TRAITS[i].c}"/>`}).join("")}</svg>`}
function vVision(){
  return `<div class="vhero"><span class="eyebrow">Future You</span><div class="vmatch num" style="font-family:var(--display)">${visionMatch()}%</div><h1>of the way to who you're becoming.</h1></div>

  ${radar()}
  <p class="muted" style="margin:-14px 0 0;font-size:13px;text-align:center">Pink is you now. The dashed line is Future You.</p>
  <div class="traits">${TRAITS.map(t=>{const s=traitScore(t),tr=trend(TH(t));return `<button class="trait" data-act="trait" data-id="${t.id}" style="--c:${t.c}">
   <b>${t.name}</b><span class="st ${tr}">${tr==="up"?"rising":tr==="dn"?"slipping":"steady"} · ${s}%</span><span class="bar"><i style="width:${s}%"></i></span></button>`}).join("")}</div>
  ${vBrain()}<div style="display:flex;flex-direction:column;gap:12px"><div class="sec-h"><h2>Quests</h2><span class="eyebrow">big moves</span></div>
  <div class="worlds">${PILLARS.map(p=>{const tot=p.quests.length,dn=p.quests.filter(([q])=>S.quests[p.id+":"+q]).length;return `<button class="world ${p.id==="career"?"main":""}" style="--c:${(PCOL[p.id]||"var(--sky)")}" data-act="world" data-id="${p.id}"><b>${p.name}</b><span>${dn}/${tot} cleared</span><span class="bar"><i style="width:${dn/tot*100}%"></i></span></button>`}).join("")}<button class="world" data-act="wnew" style="border:1.5px dashed var(--line);background:transparent"><b>+ New world</b><span>Your own set of quests</span></button></div></div>`}

   <div class="weekcmp"><div><span>This week</span><span class="b"><i style="width:${w0/mx*100}%;background:var(--hot)"></i></span><span class="num">${w0} XP</span></div>
   <div><span class="muted">Last week</span><span class="b"><i style="width:${w1/mx*100}%;background:var(--muted)"></i></span><span class="num muted">${w1} XP</span></div></div></div>
  <div style="display:flex;flex-direction:column;gap:12px"><div class="sec-h"><h2>Vault</h2><span class="eyebrow">fill order: left to right</span></div>

  ${friendsMgr()}<div style="display:flex;flex-direction:column;gap:10px"><div class="sec-h"><h2>Sync & backup</h2><span class="eyebrow">your data, your file</span></div>${SB?(UID?`<div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13px;min-width:0;overflow-wrap:anywhere">Syncing as ${esc(EMAIL)}</span><button class="btn soft" data-act="signout">Sign out</button></div>`:`<button class="btn hot" data-act="opensignin">Sign in to sync</button>`):""}<div class="row"><button class="btn soft" data-act="export">Export backup</button><label class="btn soft" style="cursor:pointer">Import backup<input type="file" accept="application/json,.json" id="imp" hidden></label></div></div>
  ${shelf()}

   :`<div class="empty"><h3>No entries yet.</h3><p class="muted" style="margin:0">Brain-dump anything. Claude can shape it into a clean entry.</p><button class="btn hot" data-act="proof" data-id="journal">Write today's entry</button></div>`}</div>`}

/* ======== sheets ======== */

  return `<div class="shh"><div><span class="eyebrow">Trait</span><h2 style="color:${t.c}">${t.name}</h2><p>Momentum ${m}% · Vision ${s}%</p></div>${X}</div>

  <div class="later">${t.worlds.map(w=>{const p=P(w),dn=p.quests.filter(([q])=>S.quests[w+":"+q]).length;return `<button data-act="world" data-id="${w}"><span>${p.name} quests</span><span>${dn}/${p.quests.length}</span></button>`}).join("")}</div>`}

 {id:"hippo",name:"Memory & Learning",region:"Hippocampus",c:"var(--sky)",habits:["workout","run","study","lang","read"],note:"Aerobic exercise has been linked to a larger hippocampus in adults, and learning a new language is linked to growth there too."},

let _str=null, _ovr=null, cdraft=null;
const kOf=(base,n)=>{const d=new Date(base);d.setDate(d.getDate()-n);return dkey(d)};
const dateOf=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const dayN=k=>Math.round((dateOf(k)-dateOf(S.start||today()))/864e5);

const TH=t=>HABITS.filter(h=>h.trait.id===t.id).map(h=>h.id);
function rebuild(){PILLARS=(S.pillars&&S.pillars.length)?S.pillars:DEFAULT_PILLARS;const hc=S.habitCfg||{};HABITS=CORE.filter(h=>!(hc[h.id]&&hc[h.id].hide)).map(h=>hc[h.id]&&hc[h.id].freq?{...h,freq:hc[h.id].freq}:h).concat((S.custom||[]).map(c=>({id:c.id,name:c.name,xp:c.xp||15,freq:c.freq||3,kind:"note",note:"Proof (optional)",verb:"locked in: "+c.name,trait:T(c.trait)||TRAITS[0],custom:true})))}
function sweepOn(k){const d=DY(k),p=d.picks||[];return p.length>=3&&p.every(x=>(d.done||[]).includes(x))}
function paceOn(k){const exp=HABITS.reduce((a,h)=>a+h.freq/7,0);return Math.min(100,Math.round((S.log[k]||[]).length/exp*100))}
// Day quality (0-1) comes only from what you logged. You never pick the label, except Rest.
function dayQ(k){const l=S.log[k]||[],n=l.length,exp=HABITS.reduce((a,h)=>a+h.freq/7,0),pace=Math.min(1,n/exp),d=DY(k);
  const ch=(d.done||[]).filter(x=>(d.picks||[]).includes(x)).length/3,pr=n?l.filter(id=>hasProof(E[k+"_"+id])).length/n:0,qs=Math.min(1,Object.values(S.qd||{}).filter(x=>x===k).length*.5);
  const tl=(d.todos||[]).filter(t=>!t.moved),td=tl.length?tl.filter(t=>t.done).length/tl.length:null;
  // With a to-do list that day, finishing it counts for 10%; without one, habits carry that weight.
  const q=td===null?.55*pace+.25*ch+.1*pr+.1*qs:.5*pace+.2*ch+.1*pr+.1*qs+.1*td;
  return{q:Math.min(1,q),pace,ch,pr,qs,td}}
function rateQ(q){return q>=.85?"ext":q>=.6?"prod":q>=.35?"calm":q>=.12?"relax":"not"}
// The climb: progress P runs 0-100% (OVR 60-99). A perfect day adds 0.45% (less as you climb), a good week ~1.8%, a perfect week ~3%. A day with nothing slips 0.2%.
function series(){if(_ovr)return _ovr;const out={};let P=0;const t=dateOf(today());
  for(let d=dateOf(S.start||today());d<=t;d.setDate(d.getDate()+1)){const k=dkey(d),{q}=dayQ(k);let r,delta=0;
    if(DY(k).rating==="rest"&&protectedDay(k))r="rest";else{r=rateQ(q);if(k===today()&&r==="not")r=null;if(r==="not")delta=-.2;else if(r)delta=.45*Math.pow(q,1.5)*(1.05-.25*P/100)}
    P=Math.max(0,Math.min(100,P+delta));out[k]={P,delta,q,r}}return _ovr=out}

function protectedDay(k){const r=R(DY(k).rating);if(!r||!r.rec)return false;let n=0;const b=dateOf(k);for(let i=1;i<7;i++){const x=R(DY(kOf(b,i)).rating);if(x&&x.rec)n++}return n<2}

  for(const id of ids){const h=H(id);if(!h)continue;const d=done(id,k);if(d)a+=w;if(i>0||d)e+=w*h.freq/7}}return e?Math.min(100,Math.round(a/e*100)):0}
function streak(){let n=0;const b=new Date();for(let i=(S.log[today()]||[]).length?0:1;i<400;i++){const k=kOf(b,i);if(dayN(k)<0)break;if((S.log[k]||[]).length){n++;continue}if(protectedDay(k))continue;break}return n}

function strengths(){if(_str)return _str;const out={},t=dateOf(today());for(const h of HABITS){let s=0;out[h.id]={};for(let d=dateOf(S.start||today());d<=t;d.setDate(d.getDate()+1)){const k=dkey(d);if(done(h.id,k))s+=.07*(1-s);else if(!protectedDay(k))s*=.995;out[h.id][k]=s}}return _str=out}

function rng(seed){let x=seed%2147483647;if(x<=0)x+=2147483646;return()=>(x=x*16807%2147483647)/2147483647}

async function writeEntry(id){persistLocal();sbEntry(id);if(!entriesCol)return;const{_id,...body}=E[id];try{await entriesCol.doc(id).set(body)}catch(e){setStatus("Post saved on this device. Sync failed.")}}
async function deleteEntry(id){delete E[id];persistLocal();sbDelete(id);if(!entriesCol)return;try{await entriesCol.doc(id).delete()}catch(e){}}
const setStatus=t=>$("status").textContent=t;

try{const l=localStorage.getItem("lifemax");if(l)S=merge(JSON.parse(l));const le=localStorage.getItem("lifemax_entries");if(le)E=JSON.parse(le)||{}}catch(e){}
render(true);setStatus("Saved on this device");
(async()=>{
  const use=window.claude&&window.claude.use?n=>window.claude.use(n):async()=>null;
  const [db,assets,sample]=await Promise.all([use("db"),use("assets"),use("sample")]);
  ASSETS=assets;SAMPLE=sample;if(sheet&&sheet.t==="proof")renderSheet();
  if(!db)return;DB=db;stateRef=db.doc("tracker/state");entriesCol=db.collection("entries");
  const timer=setTimeout(()=>setStatus("Can't reach your account yet. Progress stays on this device."),10000);
  stateRef.onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(timer);if(s.metadata.hasPendingWrites)return;
    if(s.exists){S=merge(s.data());if(!S.start){S.start=today();save()}persistLocal();render();setStatus("Synced to your account")}},()=>{clearTimeout(timer);setStatus("Sync stopped. Progress stays on this device.")});
  entriesCol.orderBy("ts","desc").limit(400).onSnapshot(q=>{if(q.metadata.hasPendingWrites)return;const n={};q.docs.forEach(d=>{n[d.id]={...d.data(),_id:d.id}});
    if(!q.metadata.fromCache||q.size){E=n;persistLocal();render()}},()=>{});
})();

function sSignin(){return `<div class="shh"><div><span class="eyebrow">Sync</span><h2>Sign in</h2><p>Use the login you made in Supabase. You only do this once on this phone.</p></div>${X}</div>
  <div class="field"><label for="si-email">Email</label><input id="si-email" type="email" autocomplete="username" autocapitalize="off" data-s="email" value="${esc(SI.email)}"></div>
  <div class="field"><label for="si-pass">Password</label><input id="si-pass" type="password" autocomplete="current-password" data-s="pass"></div>
  ${SI.err?`<p style="margin:0;color:var(--hot);font-size:14px">${esc(SI.err)}</p>`:""}
  <div class="row"><button class="btn hot" data-act="signin" ${SI.busy?"disabled":""}>${SI.busy?"Signing in…":"Sign in"}</button><button class="btn soft" data-act="close">Later</button></div>`}
function photoSrc(p){if(!p)return"";if(p.startsWith("blob:")||p.startsWith("data:"))return p;if(PH[p])return PH[p];
  if(SB&&UID&&!PHQ.has(p)){PHQ.add(p);clearTimeout(phT);phT=setTimeout(fetchPhotos,60)}return BLANK}
async function fetchPhotos(){const paths=[...PHQ].filter(p=>!PH[p]);if(!paths.length)return;try{const{data}=await SB.storage.from("proof").createSignedUrls(paths,604800);(data||[]).forEach(x=>{if(x.signedUrl)PH[x.path]=x.signedUrl});render()}catch(e){}}
function setSession(s){UID=s&&s.user?s.user.id:null;EMAIL=s&&s.user?s.user.email:"";SAMPLE=UID?{json:async p=>aiJSON(await ai(p))}:null;
  ASSETS=UID?{upload:async blob=>{const p=UID+"/"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+".jpg";const{error}=await SB.storage.from("proof").upload(p,blob,{contentType:"image/jpeg"});if(error)throw error;return{id:p}}}:null}
function sbQueue(){if(!SB||!UID)return;clearTimeout(sbTimer);sbTimer=setTimeout(sbPushState,800)}
async function sbPushState(){if(!SB||!UID)return;if(sbBusy){sbAgain=true;return}sbBusy=true;
  const{error}=await SB.from("lifemax_state").upsert({user_id:UID,state:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()});
  setStatus(error?"Saved on this phone. Sync will retry.":"Synced · "+EMAIL);sbBusy=false;sbCardQueue();if(sbAgain){sbAgain=false;sbPushState()}}
async function sbEntry(id){if(!SB||!UID||!E[id])return;const{_id,...b}=E[id];const{error}=await SB.from("lifemax_entries").upsert({user_id:UID,id,body:b,ts:b.ts||Date.now()});if(error)setStatus("Post saved on this phone. Sync will retry.")}
async function sbDelete(id){if(!SB||!UID)return;await SB.from("lifemax_entries").delete().eq("user_id",UID).eq("id",id)}
async function sbPull(){if(!SB||!UID)return;setStatus("Syncing…");
  const{data:row,error}=await SB.from("lifemax_state").select("state,updated_at").eq("user_id",UID).maybeSingle();
  if(error){setStatus("Couldn't sync. Saved on this phone.");return}
  const local=S.updatedAt||0,remote=row?(row.state.updatedAt||Date.parse(row.updated_at)||1):0;
  if(row&&remote>local){S=merge(row.state);persistLocal()}else if(!row||local>remote)await sbPushState();
  const{data:rows}=await SB.from("lifemax_entries").select("id,body,ts").eq("user_id",UID);
  const rem={};(rows||[]).forEach(r=>{rem[r.id]={...r.body,_id:r.id}});
  const loc=E,mine=Object.keys(loc).filter(id=>!rem[id]||(loc[id].ts||0)>(rem[id].ts||0));
  E={...rem};for(const id of mine)E[id]=loc[id];persistLocal();
  if(mine.length)await SB.from("lifemax_entries").upsert(mine.map(id=>{const{_id,...b}=E[id];return{user_id:UID,id,body:b,ts:b.ts||Date.now()}}));
  render();setStatus("Synced · "+EMAIL);sbProfile()}
function loadSb(){return new Promise(res=>{const urls=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js","https://unpkg.com/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"];let i=0;
  const go=()=>{if(window.supabase||i>=urls.length)return res();const sc=document.createElement("script");sc.src=urls[i++];sc.onload=()=>res();sc.onerror=go;document.head.appendChild(sc)};go()})}
(async()=>{if(!SB_URL.startsWith("https://"))return;await loadSb();if(!window.supabase||!window.supabase.createClient){setStatus("Saved on this phone. Sync loads when you're online.");return}
  SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const{data}=await SB.auth.getSession();setSession(data.session);
  SB.auth.onAuthStateChange((ev,s)=>{const was=UID;setSession(s);if(UID&&UID!==was)sbPull();if(!UID&&was)render()});
  if(UID)sbPull();else{setStatus("Saved on this phone. Sign in on the Me tab to sync.");render();let seen=null;try{seen=localStorage.getItem("lifemax_si");localStorage.setItem("lifemax_si","1")}catch(e){}if(!seen&&!sheet)openSheet("signin")}
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&UID)sbPull()});
  setInterval(()=>{if(UID&&document.visibilityState==="visible")loadFriends()},60000);
})();
